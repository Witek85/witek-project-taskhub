<h1>Tasks</h1>

<p-table
  [value]="tasks()"
  [loading]="loading()"
  dataKey="id"
  styleClass="p-datatable-gridlines"
>
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Priority</th>
      <th>Status</th>
      <th>Created</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-task>
    <tr class="task-row" (click)="openTask(task)">
      <td>{{ task.id }}</td>
      <td>{{ task.name }}</td>
      <td>
        <p-tag [value]="task.priority"></p-tag>
      </td>
      <td>
        <p-tag [value]="task.status"></p-tag>
      </td>
      <td>{{ task.createdAt }}</td>
      <td class="w-32">
        <div class="flex justify-end gap-2">
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [outlined]="true"
            severity="secondary"
            (onClick)="editTask($event, task.id)"
          />

          <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [outlined]="true"
            severity="danger"
            (onClick)="deleteTask($event, task.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
