<h1>Tasks</h1>

<div class="card flex flex-col gap-4">
  <form [formGroup]="taskListPageStateService.taskFilterForm">
    <div class="font-semibold text-xl">Filters</div>
      <div class="flex flex-wrap gap-6">
        <div class="flex flex-col grow basis-0 gap-2">
          <label for="name2">Name</label>
          <input 
          pInputText 
          type="text" 
          [formControl]="taskListPageStateService.taskFilterForm.controls.name" 
          />
        </div>
        <div class="flex flex-col grow basis-0 gap-2">
          <label for="name2">Priority</label>
          <p-select 
              [formControl]="taskListPageStateService.taskFilterForm.controls.priority" 
              [options]="priorities()" 
              optionLabel="label" 
              optionValue="value" 
              placeholder="Select" 
          />
        </div>
        <div class="flex flex-col grow basis-0 gap-2">
          <label for="name2">Status</label>
          <p-select 
            [formControl]="taskListPageStateService.taskFilterForm.controls.status" 
            [options]="statuses()" 
            optionLabel="label" 
            optionValue="value" 
            placeholder="Select" 
          />
        </div>
        <div class="flex items-end gap-2">
          <p-button
              type="button"
              label="Clear"
              severity="secondary"
              icon="pi pi-times"
              (onClick)="onClear()">
          </p-button>

          <p-button
              type="submit"
              label="Submit"
              icon="pi pi-check"
              (onClick)="onSubmit()">
          </p-button>
        </div>
      </div>
  </form>
</div>

<p-table
  [value]="tasks()"
  [loading]="loading()"
  dataKey="id"
  styleClass="p-datatable-gridlines"
>
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Priority</th>
      <th>Status</th>
      <th>Created</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-task>
    <tr class="task-row" (click)="openTask(task)">
      <td>{{ task.id }}</td>
      <td>{{ task.name }}</td>
      <td>
        <p-tag [value]="task.priority"></p-tag>
      </td>
      <td>
        <p-tag [value]="task.status"></p-tag>
      </td>
      <td>{{ task.createdAt }}</td>
      <td class="w-32">
        <div class="flex justify-end gap-2">
          <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [outlined]="true"
            severity="secondary"
            (onClick)="editTask($event, task.id)"
          />

          <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [outlined]="true"
            severity="danger"
            (onClick)="onDeleteTask($event, task.id)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
<p-confirmdialog [style]="{ width: '450px' }" />
